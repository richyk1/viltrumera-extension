name: Release Extension

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bump patch version
        id: version
        run: |
          OLD=$(jq -r '.version' package.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD"
          NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          jq --arg v "$NEW" '.version = $v' package.json > package.tmp && mv package.tmp package.json
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped $OLD → $NEW"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and zip (Chrome + Edge)
        run: pnpm zip

      - name: Build and zip (Firefox)
        run: pnpm zip:firefox

      - name: Delete existing latest release
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            .output/viltrumera-extension-${{ steps.version.outputs.version }}-chrome.zip \
            .output/viltrumera-extension-${{ steps.version.outputs.version }}-firefox.zip \
            .output/viltrumera-extension-${{ steps.version.outputs.version }}-sources.zip \
            --title "Viltrumera Extension v${{ steps.version.outputs.version }}" \
            --notes "One codebase, built per browser with WXT.

          ## Chrome / Edge / Brave (\`-chrome.zip\`)
          1. Download and extract the chrome zip
          2. Go to \`chrome://extensions\`, enable **Developer mode**
          3. Click **Load unpacked** and select the extracted folder

          ## Firefox (\`-firefox.zip\`)
          Temporary install (resets on restart): \`about:debugging\` → **This Firefox** → **Load Temporary Add-on** → pick the zip.
          A permanently-installable signed build (free AMO signing) is planned.

          The \`-sources.zip\` is the unbuilt source for review." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
