name: Release Extension

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: version
        run: |
          OLD=$(jq -r '.version' manifest.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD"
          NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          jq --arg v "$NEW" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped $OLD → $NEW"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Package extension
        run: |
          mkdir -p dist
          zip -r dist/viltrumera-extension-v${{ steps.version.outputs.version }}.zip \
            manifest.json background.js content.js config.js \
            popup.html popup.css popup.js \
            icons/

      - name: Delete existing latest release
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/viltrumera-extension-v${{ steps.version.outputs.version }}.zip \
            --title "Viltrumera Extension v${{ steps.version.outputs.version }}" \
            --notes "Download the zip, extract it, then load it in Chrome:

          1. Go to \`chrome://extensions\`
          2. Enable **Developer mode** (top right)
          3. Click **Load unpacked** and select the extracted folder" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
